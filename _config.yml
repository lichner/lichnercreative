title: "Lichner Creative Pty Ltd"
description: "Perth IT consulting. Cloud architecture, integration and data, software development, DevOps and automation with AI across Microsoft, Azure and Databricks."
baseurl: ""
url: "https://lichnercreative.com.au"
timezone: "Australia/Perth"
lang: en_AU

# Used by jekyll-seo-tag for Organization structured data
logo: /assets/images/apple-touch-icon.png
social:
  name: Lichner Creative Pty Ltd
  links:
    - https://www.linkedin.com/company/lichner-creative/

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - prompt_initial.md
  - "*.sh"
  - vendor
  - _to_delete

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      image: /assets/images/og-image.png
